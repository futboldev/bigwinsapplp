
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigWinsArena</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101a2a;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    text-align: center;
}

main {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 40px 20px 60px;
}

.download-text {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 18px;
}

.download-btn {
    display: inline-block;
    transition: .2s;
}

.download-btn:hover {
    transform: translateY(-3px);
}

.playstore-logo {
    display: block;
    width: 245px;
    max-width: 100%;
    height: auto;
}

.preview-frame {
    margin: 45px auto 0;
    width: 100%;
    max-width: 590px;
    padding: 12px;
    background: #202c40;
    border: 1px solid #34445d;
    border-radius: 24px;
    box-shadow: 0 25px 65px rgba(0,0,0,.45);
}

.preview-frame img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 13px;
}

@media(max-width: 600px) {
    main {
        padding: 30px 15px 40px;
    }

    .preview-frame {
        margin-top: 35px;
        padding: 7px;
        border-radius: 17px;
    }
}
</style>
</head>

<body>

<main>

    <p class="download-text">👇 DOWNLOAD NOW</p>

    <a class="download-btn"
       href="https://play.google.com/store/apps/details?id=sure.bigwinsarena"
       target="_blank"
       rel="noopener noreferrer">

        <img
          src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
          alt="Get it on Google Play"
          class="playstore-logo">

    </a>

    <div class="preview-frame">
        <img src="76293.jpg" alt="BigWinsArena App Screenshot">
    </div>

</main>

</body>
</html>
